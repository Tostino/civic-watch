<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <!-- The same geometry as components/Mark.tsx, on a tile.
       The header mark sits on the page and needs no background; a favicon sits
       in browser chrome we do not control, so it carries its own paper. -->
  <style>
    .tile { fill: #faf8f4 }
    .rec  { fill: #1c5170 }
    .live { fill: #a8480f }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #14161a }
      .rec  { fill: #79b8dc }
      .live { fill: #f0913f }
    }
  </style>
  <rect class="tile" width="24" height="24" rx="5"/>
  <rect class="rec"  x="3.5" y="3"    width="17" height="2.6" rx="1.3"/>
  <rect class="rec"  x="3.5" y="8"    width="17" height="2.6" rx="1.3" opacity=".68"/>
  <rect class="rec"  x="3.5" y="13"   width="11" height="2.6" rx="1.3" opacity=".44"/>
  <rect class="live" x="3.5" y="18.4" width="17" height="2.9" rx="1.45"/>
</svg>
