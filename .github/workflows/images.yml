name: image

# Builds the one runtime image and pushes it to GHCR. Postgres is not built
# here — it is stock pgvector/pgvector:pg18 (deploy/postgres-unraid.md).

on:
  push:
    branches: [main]
    paths:
      - "bin/**"
      - "web/**"
      - "ui/**"
      - "deploy/Dockerfile"
      - "deploy/entrypoint.sh"
      - "deploy/requirements-api.txt"
      - ".dockerignore"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercase, hardcoded. GHCR rejects an uppercase path and
          # `github.repository_owner` is "Tostino", which is the classic way
          # this workflow fails on its first run.
          images: ghcr.io/tostino/civic-watch
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          # Context is the repo root: the Dockerfile copies bin/, web/ and ui/.
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 only. The Unraid box is x86, and arm64 would mean emulating a
          # torch install, which would dominate the whole run.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
