<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask · Pasco Meetings</title>
<style>
  :root{--bg:#fbfbfa;--panel:#fff;--border:#e4e2dd;--text:#24211d;--muted:#78736b;
    --faint:#a8a29a;--accent:#b4530a;--soft:#fdf1e5;--ok:#2f7d4f;
    --shadow:0 1px 2px rgba(0,0,0,.05)}
  @media (prefers-color-scheme:dark){:root{--bg:#16150f;--panel:#1e1d17;
    --border:#33312a;--text:#eeece6;--muted:#9b958a;--faint:#6f6a61;
    --accent:#e8905a;--soft:#2b2118;--ok:#6cc48d;--shadow:0 1px 2px rgba(0,0,0,.3)}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;gap:10px;align-items:center;padding:8px 14px;flex-wrap:wrap;
    background:var(--panel);border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:15}
  h1{font-size:14px;margin:0;font-weight:650;white-space:nowrap}
  h1 span{color:var(--accent)}
  nav a{font-size:13px;color:var(--muted);text-decoration:none;padding:3px 8px;
    border-radius:6px}
  nav a.on{background:var(--soft);color:var(--accent);font-weight:600}
  .stat{font-size:11.5px;color:var(--faint);margin-left:auto;white-space:nowrap}
  main{max-width:820px;margin:0 auto;padding:18px 16px 90px}
  .askbox{display:flex;gap:8px;margin-bottom:6px}
  #q{flex:1;font:inherit;font-size:16px;padding:11px 13px;border-radius:9px;
    border:1px solid var(--border);background:var(--panel);color:var(--text)}
  #q:focus{outline:2px solid var(--accent);outline-offset:-1px}
  button{font:inherit;cursor:pointer;border:1px solid var(--border);
    border-radius:9px;padding:11px 17px;background:var(--accent);color:#fff;
    border-color:var(--accent);font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  .hint{font-size:12.5px;color:var(--faint);margin-bottom:16px}
  .ex{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 22px}
  .ex button{background:var(--panel);color:var(--text);border-color:var(--border);
    font-weight:400;font-size:13px;padding:6px 10px;border-radius:14px}
  .ex button:hover{border-color:var(--accent);color:var(--accent)}

  #stages{margin:14px 0;font-size:13px}
  .stage{display:flex;gap:9px;align-items:baseline;padding:3px 0;color:var(--muted)}
  .stage .tick{color:var(--ok);width:13px}
  .stage.now{color:var(--text)}
  .stage.now .tick{color:var(--accent)}
  .bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;
    margin-top:5px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;
    transition:width .25s}

  .answer{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:16px 18px;box-shadow:var(--shadow);margin-bottom:18px}
  .answer h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);margin:0 0 10px;font-weight:650}
  .answer p{margin:0 0 11px}
  .answer strong{font-weight:650}
  .answer ul{margin:0 0 11px;padding-left:20px}
  cite{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);
    background:var(--soft);border:1px solid var(--border);border-radius:4px;
    padding:0 5px;cursor:pointer;margin:0 1px;vertical-align:super}
  cite:hover{background:var(--accent);color:#fff}

  .evhead{font-size:12px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);font-weight:650;margin:22px 0 8px}
  .ev{border:1px solid var(--border);border-radius:8px;background:var(--panel);
    padding:9px 11px;margin-bottom:7px;cursor:pointer;font-size:13.5px}
  .ev:hover{border-color:var(--accent)}
  .ev.hi{border-color:var(--accent);background:var(--soft)}
  .evtop{display:flex;gap:8px;align-items:baseline;font-size:11.5px;
    color:var(--muted);margin-bottom:3px;flex-wrap:wrap}
  .evtop b{color:var(--text)}
  .evtop .id{color:var(--accent);font-weight:700}
  .unk{color:var(--faint);font-style:italic;font-weight:400}

  /* The official record: what the county published and the minutes recorded. */
  .dec{border:1px solid var(--border);border-left:3px solid var(--accent);
    border-radius:8px;background:var(--panel);padding:10px 13px;margin-bottom:8px;
    box-shadow:var(--shadow)}
  .dec.hi{background:var(--soft)}
  .dectop{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;
    margin-bottom:3px}
  .dectop .dt{font-size:11.5px;color:var(--muted);margin-left:auto}
  .dectitle{font-size:14.5px;line-height:1.4}
  .dectitle a{color:var(--text);text-decoration:none}
  .dectitle a:hover{color:var(--accent)}
  .dmin{font-size:12.5px;color:var(--muted);margin-top:5px;
    padding-left:9px;border-left:2px solid var(--border)}
  .dcase{font-size:11.5px}
  .dcase a{color:var(--accent);text-decoration:none}
  .code{font-size:11px;font-weight:700;color:var(--accent);background:var(--soft);
    border:1px solid var(--border);border-radius:4px;padding:0 6px}
  .out{font-size:10.5px;font-weight:700;border-radius:4px;padding:0 7px;
    text-transform:uppercase;letter-spacing:.03em}
  .out.approved,.out.adopted{color:var(--ok);border:1px solid var(--ok)}
  .out.denied,.out.withdrawn{color:#a3341f;border:1px solid #a3341f}
  .out.continued,.out.received,.out.no_action,.out.tabled,.out.other,.out.none{
    color:var(--muted);border:1px solid var(--border);font-weight:600}
  cite.ic{vertical-align:baseline;font-size:10.5px}

  /* Evidence nested meeting -> agenda item. */
  .mgroup{margin-bottom:18px}
  .mhead{font-size:13px;font-weight:650;padding:5px 0 4px;
    border-bottom:1px solid var(--border);margin-bottom:8px}
  .mhead .mkind{font-weight:400;color:var(--muted);font-size:11.5px;
    margin-left:7px}
  .igroup{margin:0 0 10px 0;padding-left:11px;
    border-left:2px solid var(--border)}
  .ihead{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;
    font-size:12.5px;color:var(--muted);margin-bottom:5px}
  .ihead a{color:var(--text);text-decoration:none}
  .ihead a:hover{color:var(--accent)}
  .err{color:#b4231a;font-size:13.5px;padding:10px 0}

  #dock{position:fixed;right:12px;bottom:12px;width:376px;max-width:42vw;z-index:30;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 6px 24px rgba(0,0,0,.2);display:none;overflow:hidden}
  #dock.open{display:block}
  #dockbar{display:flex;gap:8px;align-items:center;padding:5px 9px;font-size:11.5px;
    color:var(--muted);border-bottom:1px solid var(--border)}
  #dockbar b{color:var(--text);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  #dockbar button{margin-left:auto;padding:1px 7px;background:var(--bg);
    color:var(--text);border-color:var(--border);font-weight:400}
  #pbox{position:relative;padding-bottom:56.25%;height:0;background:#000}
  #pbox iframe,#pbox>div{position:absolute;inset:0;width:100%;height:100%}
  @media (max-width:860px){#dock{left:8px;right:8px;width:auto;max-width:none}}
</style>
</head>
<body>
<header>
  <h1>Pasco <span>Ask</span></h1>
  <nav><a href="/">Research</a><a href="/ask" class="on">Ask</a>
       <a href="/speakers">Workbench</a></nav>
  <span class="stat" id="stat"></span>
</header>
<main>
  <div class="askbox">
    <input id="q" placeholder="Ask anything about these meetings…" autofocus>
    <button id="go">Ask</button>
  </div>
  <div class="hint">Reads the transcripts and answers with citations you can play.
    Takes 20–60 seconds.</div>
  <div class="ex" id="examples"></div>
  <div id="stages"></div>
  <div id="out"></div>
</main>
<div id="dock">
  <div id="dockbar"><b id="docktitle"></b><button id="dockclose">✕</button></div>
  <div id="pbox"><div id="player"></div></div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),
  m=Math.floor(s%3600/60),x=s%60;
  return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};

const EXAMPLES=[
 "What was decided about the school zone speed cameras?",
 "What was the sentiment of public comment on the license plate cameras?",
 "Has the board discussed impact fee increases, and what changed?",
 "What happened with the Orange Belt Trail alignment?",
 "How has Mariano argued about surveillance and data collection?",
 "What did staff say about wastewater capacity in New Port Richey?",
];
$('#examples').innerHTML=EXAMPLES.map(e=>`<button>${esc(e)}</button>`).join('');
$$('#examples button').forEach(b=>b.onclick=()=>{$('#q').value=b.textContent;run()});

/* player */
let player=null,ready=false,pending=null,curVid=null;
function onYouTubeIframeAPIReady(){
  player=new YT.Player('player',{playerVars:{rel:0,modestbranding:1},
    events:{onReady:()=>{ready=true;if(pending){play(...pending);pending=null}}}});
}
function play(vid,t,title){
  $('#dock').classList.add('open');
  if(title)$('#docktitle').textContent=title;
  if(!ready){pending=[vid,t,title];return}
  if(curVid===vid)player.seekTo(t,true);
  else{player.loadVideoById({videoId:vid,startSeconds:t});curVid=vid}
}
$('#dockclose').onclick=()=>{$('#dock').classList.remove('open');
  try{player.pauseVideo()}catch(e){}};

/* streaming ask */
let es=null,evidence={};
const STAGES=[['planning','Planning the search'],['retrieved','Searching transcripts'],
  ['reading','Reading passages'],['answering','Writing the answer']];
let stageState={};

function renderStages(active){
  $('#stages').innerHTML=STAGES.map(([k,label])=>{
    const st=stageState[k];
    const on=k===active;
    return `<div class="stage ${on?'now':''}">
      <span class="tick">${st?'✓':on?'▸':'·'}</span>
      <span>${label}${st?` — ${esc(st)}`:''}</span></div>`;
  }).join('')+(stageState._bar!=null?
    `<div class="bar"><i style="width:${stageState._bar}%"></i></div>`:'');
}

function run(){
  const q=$('#q').value.trim();
  if(!q) return;
  if(es) es.close();
  stageState={};evidence={};
  $('#out').innerHTML='';
  $('#go').disabled=true;
  renderStages('planning');

  es=new EventSource('/api/ask?q='+encodeURIComponent(q));
  es.addEventListener('stage',e=>{
    const d=JSON.parse(e.data);
    if(d.stage==='planned')
      stageState.planning=d.queries.join(' · ')+(d.spread?'  (across meetings)':'');
    if(d.stage==='retrieved')
      stageState.retrieved=`${d.passages} passages from ${d.meetings} meetings`;
    if(d.stage==='reading') stageState._bar=0;
    if(d.stage==='read_progress'){
      stageState._bar=Math.round(100*d.done/d.total);
      stageState.reading=`${d.done}/${d.total} batches · ${d.kept} relevant`;
    }
    if(d.stage==='answering'){
      stageState.reading=stageState.reading||'';
      stageState._bar=null;
    }
    const active=d.stage==='answering'?'answering'
      :d.stage.startsWith('read')?'reading'
      :d.stage==='retrieved'?'reading':'retrieved';
    renderStages(active);
  });
  es.addEventListener('answer',e=>{
    const d=JSON.parse(e.data);
    (d.evidence||[]).forEach(c=>evidence[c.id]=c);
    STAGES.forEach(([k])=>{if(!stageState[k])stageState[k]=''});
    stageState._bar=null;
    $('#stages').innerHTML='';
    render(d);
    $('#go').disabled=false;es.close();
  });
  es.addEventListener('error',e=>{
    let msg='The agent failed. Is LLM_API_KEY set in the server environment?';
    try{msg=JSON.parse(e.data).error||msg}catch(_){}
    $('#stages').innerHTML='';
    $('#out').innerHTML=`<div class="err">${esc(msg)}</div>`;
    $('#go').disabled=false;if(es)es.close();
  });
}
$('#go').onclick=run;
$('#q').onkeydown=e=>{if(e.key==='Enter')run()};

// A speaker the pipeline could not identify is shown as unidentified, never as
// a raw diarization label. "Speaker 3" and "Group 465" read like names and are
// not - they are internal ids, and they change between runs.
function who(s){
  if(!s) return '<span class="unk">unidentified</span>';
  if(/^(Group \d+|Speaker \d+|SPEAKER_\d+)$/i.test(s))
    return '<span class="unk">unidentified speaker</span>';
  if(s==='(exchange)') return '<span class="unk">several speakers</span>';
  return esc(s);
}

// The published record, above the transcript. A vote can only ever be SEEN in
// a transcript; its result is published in the minutes, and that is what these
// cards carry.
function decisionCards(items){
  const pub=items.filter(i=>i.source==='agenda');
  if(!pub.length) return '';
  return `<div class="evhead">The official record · ${pub.length} agenda item${
    pub.length===1?'':'s'}</div>`+pub.map(i=>`
    <div class="dec" id="item${i.id}">
      <div class="dectop">
        ${i.code?`<span class="code">${esc(i.code)}</span>`:''}
        ${i.outcome?`<span class="out ${esc(i.outcome)}">${esc(i.outcome)}</span>`
                   :'<span class="out none">no disposition recorded</span>'}
        <span class="dt">${esc(i.date)} · ${esc(i.body)}</span>
      </div>
      <div class="dectitle"><a href="/item/${i.id}">${esc(i.title||'')}</a></div>
      ${i.case_id?`<div class="dcase">case
        <a href="/case/${encodeURIComponent(i.case_id)}">${esc(i.case_id)}</a></div>`:''}
      ${i.disposition?`<div class="dmin">${esc(i.disposition)}</div>`:''}
    </div>`).join('');
}

// Evidence nested meeting -> agenda item. A flat chronological list of quotes
// gives no sense of which meeting or which item a quote belongs to, which is
// the one thing a reader needs to judge it.
function groupEvidence(ev){
  const meetings=new Map();
  for(const c of ev){
    const mk=c.date||'undated';
    if(!meetings.has(mk)) meetings.set(mk,new Map());
    const ik=c.agenda_item_id||('_'+(c.title||''));
    const items=meetings.get(mk);
    if(!items.has(ik)) items.set(ik,{item:c,cites:[]});
    items.get(ik).cites.push(c);
  }
  let h='';
  for(const [date,items] of meetings){
    const first=[...items.values()][0].item;
    h+=`<div class="mgroup"><div class="mhead">${esc(date)}
        <span class="mkind">${esc(first.kind==='planning'?'Planning Commission'
          :first.kind==='bcc'?'Board of County Commissioners':(first.title||''))}</span></div>`;
    for(const {item,cites} of items.values()){
      const label=item.item||item.title||'(unsegmented)';
      h+=`<div class="igroup"><div class="ihead">
          ${item.code?`<span class="code">${esc(item.code)}</span>`:''}
          ${item.agenda_item_id?`<a href="/item/${item.agenda_item_id}">${esc(label)}</a>`
                               :esc(label)}
          ${item.outcome?`<span class="out ${esc(item.outcome)}">${esc(item.outcome)}</span>`:''}
          ${item.case_id?`<span class="dcase"><a href="/case/${
            encodeURIComponent(item.case_id)}">${esc(item.case_id)}</a></span>`:''}
        </div>`;
      for(const c of cites)
        h+=`<div class="ev" id="ev${c.id}" data-v="${c.video_id}"
            data-t="${c.start}" data-title="${esc(c.title)}">
            <div class="evtop"><span class="id">[${c.id}]</span>
              <b>${who(c.speaker)}</b><span>${fmt(c.start)}</span></div>
            <div>${esc(c.quote)}</div></div>`;
      h+=`</div>`;
    }
    h+=`</div>`;
  }
  return h;
}

function render(d){
  // [12] citations become clickable chips that seek the player
  const body=esc(d.answer)
    // [item:N] cites the published record and scrolls to its card; [N] cites a
    // transcript passage and seeks the player. Item citations are matched
    // FIRST, or the trailing digits of "[item:23369]" match the passage rule.
    .replace(/\[item:(\d+)\]/g,(m,id)=>`<cite class="ic" data-item="${id}">${
      (d.decisions||[]).find(x=>String(x.id)===id)?.code||'record'}</cite>`)
    .replace(/\[(\d+)\]/g,(m,id)=>evidence[id]?`<cite data-id="${id}">${id}</cite>`:m)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .split(/\n{2,}/).map(par=>{
      const lines=par.split('\n');
      if(lines.every(l=>/^\s*[-*]\s/.test(l)))
        return '<ul>'+lines.map(l=>`<li>${l.replace(/^\s*[-*]\s/,'')}</li>`).join('')+'</ul>';
      return `<p>${lines.join('<br>')}</p>`;
    }).join('');
  const ev=(d.evidence||[]);
  $('#out').innerHTML=`<div class="answer"><h2>Answer</h2>${body}</div>`+
    decisionCards(d.decisions||[])+
    (ev.length?`<div class="evhead">Evidence · ${ev.length} passages</div>`
       +groupEvidence(ev)
     :'<div class="hint">No supporting passages were kept.</div>');

  $$('.ev').forEach(el=>el.onclick=()=>seekEv(el));
  $$('cite').forEach(el=>el.onclick=()=>{
    if(el.dataset.item){
      const c=document.getElementById('item'+el.dataset.item);
      if(c){c.scrollIntoView({block:'center'});c.classList.add('hi');
            setTimeout(()=>c.classList.remove('hi'),1400)}
      return;
    }
    const t=document.getElementById('ev'+el.dataset.id);
    if(t){t.scrollIntoView({block:'center'});seekEv(t)}
  });
}
function seekEv(el){
  $$('.ev.hi').forEach(e=>e.classList.remove('hi'));
  el.classList.add('hi');
  play(el.dataset.v,Math.max(0,parseFloat(el.dataset.t)-1.5),el.dataset.title);
}

(async()=>{
  const s=await(await fetch('/api/stats')).json();
  $('#stat').textContent=`${s.done} meetings · ${Math.round(s.done_hours)}h · `
    +`${s.utterances.toLocaleString()} lines`;
})();
const tag=document.createElement('script');
tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
</script>
</body>
</html>
