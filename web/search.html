<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pasco Meeting Research</title>
<style>
  :root{--bg:#fbfbfa;--panel:#fff;--border:#e4e2dd;--text:#24211d;--muted:#78736b;
    --faint:#a8a29a;--accent:#b4530a;--soft:#fdf1e5;--mark:#ffe9a8;--row:#faf9f7;
    --shadow:0 1px 2px rgba(0,0,0,.05)}
  @media (prefers-color-scheme:dark){:root{--bg:#16150f;--panel:#1e1d17;
    --border:#33312a;--text:#eeece6;--muted:#9b958a;--faint:#6f6a61;
    --accent:#e8905a;--soft:#2b2118;--mark:#6a5320;--row:#211f19;
    --shadow:0 1px 2px rgba(0,0,0,.3)}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14.5px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;gap:9px;align-items:center;padding:8px 14px;flex-wrap:wrap;
    background:var(--panel);border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:15}
  h1{font-size:14px;margin:0;font-weight:650;white-space:nowrap}
  h1 span{color:var(--accent)}
  nav a{font-size:13px;color:var(--muted);text-decoration:none;padding:3px 8px;
    border-radius:6px}
  nav a.on{background:var(--soft);color:var(--accent);font-weight:600}
  input,select,button{font:inherit;color:var(--text);background:var(--bg);
    border:1px solid var(--border);border-radius:7px;padding:6px 10px}
  button{cursor:pointer}button:hover{border-color:var(--accent)}
  #q{flex:1 1 240px;min-width:150px;font-size:15px}
  #q:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .filters{display:flex;gap:8px;flex:1 1 auto;flex-wrap:wrap}
  .stat{font-size:11.5px;color:var(--faint);white-space:nowrap;margin-left:auto}

  main{display:grid;grid-template-columns:minmax(320px,5fr) 6fr;
    height:calc(100vh - 52px)}
  #results,#reader{overflow-y:auto;padding:12px 14px}
  #results{border-right:1px solid var(--border)}
  #back{display:none}

  /* Narrow: master-detail. Two panes side by side at 480px each would be
     unusable, and stacking them puts the reader below the fold. */
  @media (max-width:860px){
    main{grid-template-columns:1fr}
    #reader{display:none}
    body.reading #results{display:none}
    body.reading #reader{display:block}
    #back{display:inline-block}
    body:not(.reading) #back{display:none}
  }

  .hit{padding:9px 11px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);margin-bottom:7px;cursor:pointer;box-shadow:var(--shadow)}
  .hit:hover{border-color:var(--accent)}
  .hit.on{border-color:var(--accent);background:var(--soft)}
  .htop{display:flex;gap:7px;align-items:baseline;margin-bottom:4px;font-size:11.5px;
    color:var(--muted);flex-wrap:wrap}
  .ts{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}
  .who{font-weight:600;color:var(--text)}
  a.who.anon{font-weight:400;color:var(--muted);text-decoration:none;
    border-bottom:1px dotted var(--faint)}
  a.who.anon:hover{color:var(--accent);border-bottom-color:var(--accent)}
  .chip{font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:0 5px;
    border-radius:4px;background:var(--soft);color:var(--accent);
    border:1px solid var(--border)}
  mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
  .src{font-size:11.5px;color:var(--faint);margin-top:3px}
  /* The agenda item a hit sits under. Often the only thing that makes it
     legible: "all in favor say aye" says nothing about what was voted on. */
  .item{font-size:11.5px;color:var(--accent);margin-top:4px}
  .item a{color:var(--accent);text-decoration:none;border-bottom:1px dotted}
  .item a:hover{border-bottom-style:solid}
  .seg{margin:18px 0 6px;padding:6px 8px;border-radius:6px;background:var(--soft);
    border:1px solid var(--border);font-size:12.5px;font-weight:600;
    display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;
    position:sticky;top:-12px;z-index:2}
  .seg em{font-weight:400;color:var(--muted);font-style:normal}
  .meta{font-size:12.5px;color:var(--muted);margin:0 0 10px}
  .meta b{color:var(--text);font-weight:600}

  .utt{display:grid;grid-template-columns:56px 108px 1fr;gap:8px;padding:4px 7px;
    border-radius:6px;cursor:pointer;align-items:baseline}
  .utt:hover{background:var(--panel)}
  .utt.playing{background:var(--soft)}
  .utt .ts{font-size:11.5px}
  .utt .who,.utt a.who{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  @media (max-width:640px){
    .utt{grid-template-columns:52px 1fr}
    .utt .who,.utt a.who{grid-column:2;font-size:11px}
    .utt .txt{grid-column:1/-1;padding-left:52px}
  }
  .empty{color:var(--muted);padding:26px 8px;text-align:center;font-size:13.5px}
  .note{font-size:11.5px;color:var(--faint);border-left:2px solid var(--border);
    padding-left:9px;margin:14px 0 30px}

  /* Player dock: fixed, so a result you click is never seeking a video that
     has scrolled off screen. Matches the workbench. */
  #dock{position:fixed;right:12px;bottom:12px;width:380px;max-width:42vw;z-index:30;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 6px 24px rgba(0,0,0,.2);display:none;overflow:hidden}
  #dock.open{display:block}
  #dockbar{display:flex;gap:8px;align-items:center;padding:5px 9px;font-size:11.5px;
    color:var(--muted);border-bottom:1px solid var(--border)}
  #dockbar b{color:var(--text);font-weight:600;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  #dockbar button{margin-left:auto;padding:1px 7px}
  #pbox{position:relative;padding-bottom:56.25%;height:0;background:#000}
  #pbox iframe,#pbox>div{position:absolute;inset:0;width:100%;height:100%}
  /* Must come AFTER the base #dock rule: equal specificity means source order
     decides, and placing this with the other narrow rules left the dock stuck
     at 42vw (~206px) in a docked pane. */
  @media (max-width:860px){
    #dock{left:8px;right:8px;width:auto;max-width:none}
  }
</style>
</head>
<body>
<header>
  <button id="back" title="Back to results">‹</button>
  <h1>Pasco <span>Research</span></h1>
  <nav><a href="/" class="on">Research</a><a href="/ask">Ask</a><a href="/speakers">Workbench</a></nav>
  <input id="q" placeholder="Search every transcript…" autofocus>
  <div class="filters">
    <select id="kind"><option value="all">All bodies</option></select>
    <select id="speaker"><option value="">Any speaker</option></select>
  </div>
  <span class="stat" id="stat"></span>
</header>
<main>
  <div id="results"><div class="empty">Search across every indexed meeting.</div></div>
  <div id="reader"><div class="empty">Open a result to read the transcript.</div></div>
</main>
<div id="dock">
  <div id="dockbar"><b id="docktitle"></b><button id="dockclose">✕</button></div>
  <div id="pbox"><div id="player"></div></div>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),
  m=Math.floor(s%3600/60),x=s%60;
  return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};

let player=null,ready=false,pending=null,curVid=null,utts=[],active=-1,timer=null;
function onYouTubeIframeAPIReady(){
  player=new YT.Player('player',{playerVars:{rel:0,modestbranding:1},
    events:{onReady:()=>{ready=true;if(pending){play(...pending);pending=null}},
      onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING)track()}}});
}
function play(vid,t,title){
  $('#dock').classList.add('open');
  if(title)$('#docktitle').textContent=title;
  if(!ready){pending=[vid,t,title];return}
  if(curVid===vid)player.seekTo(t,true);
  else{player.loadVideoById({videoId:vid,startSeconds:t});curVid=vid}
}
$('#dockclose').onclick=()=>{$('#dock').classList.remove('open');
  try{player.pauseVideo()}catch(e){}};
function track(){
  clearInterval(timer);
  timer=setInterval(()=>{
    if(!ready||!utts.length||!player.getCurrentTime)return;
    const t=player.getCurrentTime();
    let lo=0,hi=utts.length-1,f=-1;
    while(lo<=hi){const mid=(lo+hi)>>1;
      if(utts[mid].start<=t){f=mid;lo=mid+1}else hi=mid-1}
    if(f!==active){
      $$('.utt.playing').forEach(e=>e.classList.remove('playing'));
      const el=document.getElementById('u'+f);
      if(el){el.classList.add('playing');el.scrollIntoView({block:'nearest'})}
      active=f;
    }
  },900);
}

const who=(named,speaker,cluster)=>named
  ? `<span class="who">${esc(speaker)}</span>`
  : `<a class="who anon" href="/speakers?cluster=${cluster}"
       title="Unnamed voice — open in the Workbench"
       onclick="event.stopPropagation()">${esc(speaker)}</a>`;

let deb=null;
$('#q').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(run,220)});
$('#kind').onchange=run;$('#speaker').onchange=run;
$('#back').onclick=()=>document.body.classList.remove('reading');

async function run(){
  const q=$('#q').value.trim();
  document.body.classList.remove('reading');
  if(!q){$('#results').innerHTML='<div class="empty">Search across every indexed meeting.</div>';return}
  const d=await(await fetch(`/api/search?q=${encodeURIComponent(q)}`
    +`&kind=${$('#kind').value}&speaker=${encodeURIComponent($('#speaker').value)}`
    +`&limit=80`)).json();
  if(d.error){$('#results').innerHTML=`<div class="empty">${esc(d.error)}</div>`;return}
  if(!d.results.length){$('#results').innerHTML='<div class="empty">No matches.</div>';return}
  $('#results').innerHTML=`<div class="meta"><b>${d.total.toLocaleString()}</b>
      match${d.total===1?'':'es'}${d.total>d.results.length?` · showing ${d.results.length}`:''}</div>`+
    d.results.map(h=>`<div class="hit" data-v="${h.video_id}" data-t="${h.start}">
        <div class="htop"><span class="ts">${fmt(h.start)}</span>
          ${who(h.named,h.speaker,h.cluster)}
          <span class="chip">${esc(h.kind)}</span><span>${esc(h.upload_date||'')}</span></div>
        <div>${h.snip}</div>
        ${h.item?`<div class="item">▸ ${h.agenda_item_id
            ? `<a href="/item/${h.agenda_item_id}" onclick="event.stopPropagation()"
                 >${h.code?esc(h.code)+' ':''}${esc(h.item)}</a>`
            : esc(h.item)}${h.outcome?` · ${esc(h.outcome)}`:''}</div>`:''}
        <div class="src">${esc(h.title)}</div></div>`).join('');
  $$('.hit').forEach(el=>el.onclick=()=>{
    $$('.hit.on').forEach(e=>e.classList.remove('on'));el.classList.add('on');
    const v=el.dataset.v,t=parseFloat(el.dataset.t);
    openMeeting(v,t);play(v,Math.max(0,t-1.5),el.querySelector('.src').textContent);
  });
}

async function openMeeting(vid,seek){
  document.body.classList.add('reading');     // narrow: swap to the reader
  if(curVid!==vid||!utts.length){
    const d=await(await fetch('/api/video/'+vid)).json();
    if(d.error)return;
    utts=d.utterances;const v=d.video;
    $('#reader').innerHTML=`<div class="meta"><b>${esc(v.title)}</b><br>
        ${esc(v.upload_date||'')} · ${fmt(v.duration)} ·
        ${(v.words||0).toLocaleString()} words</div>`+
      (()=>{const at={};(d.segments||[]).forEach(s=>at[s.start_idx]=s);
        return utts.map((u,i)=>{const s=at[u.idx];
          return (s?`<div class="seg"><span class="chip">${esc(s.phase.replace(/_/g,' '))}</span>
              <span>${esc(s.title||'—')}</span>
              ${s.continued?'<em>continued from the earlier session</em>':''}</div>`:'')
            +`<div class="utt" id="u${i}" data-t="${u.start}">
              <span class="ts">${fmt(u.start)}</span>
              ${who(u.named,u.speaker,u.cluster)}
              <span class="txt">${esc(u.text)}</span></div>`}).join('')})()+
      `<div class="note">Named speakers come from voice matching and can be wrong.
        <b>Group N</b> is an unnamed voice — the same number is the same person
        across every meeting. Click one to name it in the
        <a href="/speakers">Workbench</a>.</div>`;
    $$('#reader .utt').forEach(el=>el.onclick=()=>play(vid,parseFloat(el.dataset.t)));
    active=-1;
  }
  if(seek!=null){
    const i=utts.findIndex(u=>u.start>=seek-0.01);
    document.getElementById('u'+Math.max(0,i))?.scrollIntoView({block:'center'});
  }
}

(async()=>{
  const s=await(await fetch('/api/stats')).json();
  $('#stat').textContent=`${s.done}/${s.total} mtgs · ${Math.round(s.done_hours)}h · `
    +`${s.speakers} speakers`;
  s.kinds.forEach(k=>{const o=document.createElement('option');
    o.value=k.kind;o.textContent=`${k.kind} (${k.done||0})`;$('#kind').appendChild(o)});
  const roster=await(await fetch('/api/speakers/roster')).json();
  roster.filter(r=>r.meetings>=2).slice(0,80).forEach(r=>{
    const o=document.createElement('option');
    o.value=r.name;o.textContent=`${r.name} (${r.meetings})`;$('#speaker').appendChild(o)});
})();
const tag=document.createElement('script');
tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
</script>
</body>
</html>
