<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda item · Pasco Meetings</title>
<style>
  :root{--bg:#fbfbfa;--panel:#fff;--border:#e4e2dd;--text:#24211d;--muted:#78736b;
    --faint:#a8a29a;--accent:#b4530a;--soft:#fdf1e5;--ok:#2f7d4f;--no:#a3341f;
    --shadow:0 1px 2px rgba(0,0,0,.05)}
  @media (prefers-color-scheme:dark){:root{--bg:#16150f;--panel:#1e1d17;
    --border:#33312a;--text:#eeece6;--muted:#9b958a;--faint:#6f6a61;
    --accent:#e8905a;--soft:#2b2118;--ok:#6cc48d;--no:#e2856f;
    --shadow:0 1px 2px rgba(0,0,0,.3)}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;gap:10px;align-items:center;padding:8px 14px;flex-wrap:wrap;
    background:var(--panel);border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:15}
  h1{font-size:14px;margin:0;font-weight:650;white-space:nowrap}
  h1 span{color:var(--accent)}
  nav a{font-size:13px;color:var(--muted);text-decoration:none;padding:3px 8px;
    border-radius:6px}
  main{max-width:820px;margin:0 auto;padding:18px 16px 90px}
  a{color:var(--accent)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
  .crumb{font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .code{font-size:11px;font-weight:700;color:var(--accent);background:var(--soft);
    border:1px solid var(--border);border-radius:4px;padding:1px 6px}
  h2{font-size:19px;margin:6px 0 10px;line-height:1.35;font-weight:650}
  .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);
    margin-bottom:12px}
  .meta b{color:var(--text);font-weight:600}
  .out{display:inline-block;font-size:11.5px;font-weight:700;border-radius:5px;
    padding:1px 8px;text-transform:uppercase;letter-spacing:.04em}
  .out.approved,.out.adopted{background:var(--soft);color:var(--ok);
    border:1px solid var(--ok)}
  .out.denied,.out.withdrawn{background:var(--soft);color:var(--no);
    border:1px solid var(--no)}
  .out.other,.out.continued,.out.received,.out.no_action,.out.tabled{
    background:var(--soft);color:var(--muted);border:1px solid var(--border)}
  .lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);font-weight:650;margin:14px 0 5px}
  .minutes{background:var(--soft);border-left:3px solid var(--accent);
    padding:9px 12px;border-radius:0 6px 6px 0;font-size:14px}
  .none{color:var(--faint);font-style:italic;font-size:13.5px}
  .note{font-size:12px;color:var(--muted);background:var(--soft);
    border:1px solid var(--border);border-radius:6px;padding:7px 10px;
    margin:0 0 10px}
  .row{display:flex;gap:10px;align-items:baseline;padding:6px 0;
    border-bottom:1px solid var(--border);font-size:13.5px}
  .row:last-child{border-bottom:0}
  .row .d{color:var(--muted);font-size:12.5px;white-space:nowrap;min-width:88px}
  .u{padding:7px 0;border-bottom:1px solid var(--border);cursor:pointer}
  .u:hover{background:var(--soft)}
  .u .sp{font-weight:600;font-size:12.5px}
  .u .t{color:var(--faint);font-size:11.5px;margin-left:7px}
  .u .x{margin-top:2px}
  .unk{color:var(--faint);font-style:italic;font-weight:400}
  #dock{position:fixed;right:14px;bottom:14px;width:396px;max-width:94vw;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 6px 24px rgba(0,0,0,.16);display:none;z-index:30}
  #dock.on{display:block}
  #dockbar{display:flex;gap:8px;align-items:center;padding:7px 10px;
    border-bottom:1px solid var(--border);font-size:12px}
  #dockbar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #dockbar button{border:0;background:none;color:var(--muted);cursor:pointer;
    font-size:15px}
  #player{aspect-ratio:16/9;width:100%}
</style>
</head>
<body>
<header>
  <h1>Pasco <span>Record</span></h1>
  <nav><a href="/">Research</a><a href="/ask">Ask</a>
       <a href="/speakers">Workbench</a></nav>
</header>
<main id="main"><div class="none">Loading…</div></main>
<div id="dock">
  <div id="dockbar"><b id="docktitle"></b><button id="dockclose">✕</button></div>
  <div id="pbox"><div id="player"></div></div>
</div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;',
  '>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
let yt=null,pending=null;
function onYouTubeIframeAPIReady(){
  yt=new YT.Player('player',{height:'100%',width:'100%',
    playerVars:{rel:0,modestbranding:1},
    events:{onReady:()=>{if(pending){const p=pending;pending=null;play(...p)}}}});
}
function play(vid,t,title){
  if(!yt||!yt.loadVideoById){pending=[vid,t,title];return}
  $('#dock').classList.add('on'); $('#docktitle').textContent=title||'';
  yt.loadVideoById({videoId:vid,startSeconds:Math.max(0,t)});
}
$('#dockclose').onclick=()=>{$('#dock').classList.remove('on');
  if(yt&&yt.stopVideo)yt.stopVideo()};

// A speaker the pipeline could not identify is shown as unidentified, never as
// a raw diarization label: "Speaker 3" and "Group 465" look like names to a
// reader and are not - they are internal ids that change between runs.
function who(s){
  if(!s) return '<span class="unk">unidentified</span>';
  if(/^(Group \d+|Speaker \d+|SPEAKER_\d+)$/i.test(s))
    return '<span class="unk">unidentified speaker</span>';
  if(s==='(exchange)') return '<span class="unk">several speakers</span>';
  return esc(s);
}

(async()=>{
  const id=new URLSearchParams(location.search).get('id');
  if(!id){$('#main').innerHTML='<div class="none">No item id.</div>';return}
  const r=await fetch('/api/item/'+encodeURIComponent(id));
  if(!r.ok){$('#main').innerHTML='<div class="none">No such item.</div>';return}
  const d=await r.json();
  const out=d.outcome?`<span class="out ${esc(d.outcome)}">${esc(d.outcome)}</span>`:'';
  const published=d.source==='agenda';

  let h=`<div class="card">
    <div class="crumb"><a href="/api/agenda/${d.meeting_id}">${esc(d.body)}</a>
      · ${esc(d.date)}</div>
    ${d.code?`<span class="code">${esc(d.code)}</span> `:''}${out}
    <h2>${esc(d.title||'(untitled)')}</h2>
    <div class="meta">
      ${d.case_id?`<span>case <b><a href="/case?id=${encodeURIComponent(d.case_id)}">${esc(d.case_id)}</a></b></span>`:''}
      ${d.section?`<span>section <b>${esc(d.section)}</b></span>`:''}
      ${d.phase?`<span>phase <b>${esc(d.phase)}</b></span>`:''}
      ${d.department?`<span>dept <b>${esc(d.department)}</b></span>`:''}
    </div>`;

  if(!published)
    h+=`<div class="none">This item was derived from the transcript — the
        county published no agenda entry for it, so there is no official
        title, code or recorded disposition.</div>`;

  h+=`<div class="lab">Recorded in the minutes</div>`;
  h+= d.disposition
      ? `<div class="minutes">${esc(d.disposition)}</div>`
      : `<div class="none">No disposition recorded for this item.</div>`;

  if(d.recommendation)
    h+=`<div class="lab">Staff recommendation</div><div>${esc(d.recommendation)}</div>`;
  h+=`</div>`;

  if(d.related.length){
    h+=`<div class="card"><div class="lab" style="margin-top:0">Same case,
      other meetings</div>`;
    for(const r of d.related)
      h+=`<div class="row"><span class="d">${esc(r.date)}</span>
        <span style="flex:1"><a href="/item?id=${r.id}">${esc(r.title||'')}</a></span>
        ${r.outcome?`<span class="out ${esc(r.outcome)}">${esc(r.outcome)}</span>`:''}</div>`;
    h+=`</div>`;
  }

  if(d.spans.length){
    h+=`<div class="card"><div class="lab" style="margin-top:0">In the recording</div>`;
    for(const s of d.spans)
      h+=`<div class="row"><span class="d">${fmt(s.start)}–${fmt(s.end)}</span>
        <span style="flex:1">${esc(s.video_title||'')}${s.part?' (resumed after break)':''}</span>
        <button style="border:1px solid var(--border);background:var(--panel);
          color:var(--accent);border-radius:6px;padding:2px 9px;font-size:12px;
          cursor:pointer" data-v="${esc(s.video_id)}" data-t="${s.start}"
          data-ti="${esc(s.video_title||'')}">play</button></div>`;
    h+=`</div>`;
  }

  if(d.passages.length){
    // The two halves of this page have different provenance and must not look
    // equally authoritative: everything above is what the county published,
    // while the speaker names below are inferred from voice matching and are
    // wrong often enough to see on a single screen.
    h+=`<div class="card"><div class="lab" style="margin-top:0">What was said ·
        ${d.passages.length} passages</div>
        <div class="note">Transcript and speaker names are produced
        automatically. The words are ASR output; the names are voice matching,
        whose accuracy is not currently measured. Play the recording to
        confirm anything that matters.</div>`;
    for(const p of d.passages)
      h+=`<div class="u" data-v="${esc(p.video_id)}" data-t="${p.start}"
            data-ti="${esc(d.title||'')}">
          <span class="sp">${who(p.speaker)}</span>
          <span class="t">${fmt(p.start)}</span>
          <div class="x">${esc(p.text)}</div></div>`;
    h+=`</div>`;
  }
  $('#main').innerHTML=h;
  $$('[data-v]').forEach(el=>el.onclick=()=>play(el.dataset.v,
    Math.max(0,parseFloat(el.dataset.t)-1.5),el.dataset.ti));
})();
</script>
</body>
</html>
