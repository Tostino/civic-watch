# The reading stack: the API and the UI. Postgres is NOT here — it is set up by
# hand from deploy/postgres-unraid.md, so there is one place that owns the
# database and it is not a file that gets redeployed.
#
# Nginx Proxy Manager is already running on the box and is not managed here
# either; point one proxy host at `ui` on 3000 (deploy/nginx-proxy-manager.md).
#
#   docker compose --env-file ./civic-watch.env up -d
#
# Every value below comes from the environment. Nothing county-specific is in
# this file, which is the same property the images have.

services:
  api:
    image: ghcr.io/tostino/civic-watch-api:latest
    container_name: civicwatch-api
    restart: unless-stopped
    environment:
      # The database. Points at the Postgres container on the LAN.
      PASCO_DSN: ${PASCO_DSN:?set PASCO_DSN}
      # Paid inference, for /api/ask only. Everything else is local.
      LLM_API_KEY: ${LLM_API_KEY:-}
      INFERENCE_API_BASE: ${INFERENCE_API_BASE:-}
      LLM_MODEL_AGENT: ${LLM_MODEL_AGENT:-}
      # The money ceiling and the rate limits. ASK_TRUST_PROXY must be 1 here:
      # every request arrives through NPM, so without it the whole internet
      # shares one bucket (gotcha 89).
      ASK_DAILY_MAX: ${ASK_DAILY_MAX:-400}
      ASK_PER_IP: ${ASK_PER_IP:-6}
      ASK_TRUST_PROXY: ${ASK_TRUST_PROXY:-1}
      # Set in the image already; repeated here because it is the one variable
      # whose absence degrades search silently rather than loudly.
      PASCO_EMBED_DEVICE: cpu
      TZ: ${TZ:-America/New_York}
    volumes:
      # The 0.6B embedding model. Without this it re-downloads on every
      # container recreation. The image runs as `nobody` (uid 65534), so the
      # host directory must be writable by that uid — see the Unraid notes.
      - ${MODEL_CACHE:-./models}:/models
    expose:
      - "8765"
    # Deliberately NOT published to the host. Only `ui` needs to reach it, and
    # /api/admin lives behind this port.
    networks: [civicwatch]

  ui:
    image: ghcr.io/tostino/civic-watch-ui:latest
    container_name: civicwatch-ui
    restart: unless-stopped
    depends_on: [api]
    environment:
      ARCHIVE_API: http://api:8765
      SITE_URL: ${SITE_URL:?set SITE_URL}
      SITE_CONTACT: ${SITE_CONTACT:-}
      TZ: ${TZ:-America/New_York}
    ports:
      # Bound to the Unraid LAN address, NOT loopback: Nginx Proxy Manager runs
      # in its own container, so 127.0.0.1 on the host is not reachable from it.
      # Set UI_BIND=10.0.0.6 and point the proxy host at 10.0.0.6:3000.
      - "${UI_BIND:-10.0.0.6}:3000:3000"
    networks: [civicwatch]

networks:
  civicwatch:
    driver: bridge
